name: Bug report
description: Report reproducible behavior that differs from Pyrora's documented behavior.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not report security vulnerabilities here; use SECURITY.md instead."
  - type: input
    id: version
    attributes:
      label: Pyrora version or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small runnable example and the observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and platform
    validations:
      required: true
